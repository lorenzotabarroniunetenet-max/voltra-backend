<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Voltra Admin</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0A0A0B;color:#F5F6FA;font-family:-apple-system,sans-serif;font-size:14px}.mono{font-family:monospace}a{color:#B4FF39}.wrap{max-width:1100px;margin:0 auto;padding:24px}.hdr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2A2A35;padding-bottom:16px;margin-bottom:24px}.logo{font-family:monospace;font-weight:700;letter-spacing:.18em;color:#B4FF39;font-size:18px}.card{background:#13131A;border:1px solid #2A2A35;border-radius:10px;padding:20px;margin-bottom:16px}.input,.select{width:100%;background:#0A0A0B;border:1px solid #2A2A35;color:#F5F6FA;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit}.input:focus,.select:focus{border-color:#B4FF39}.lbl{font-size:11px;font-family:monospace;text-transform:uppercase;letter-spacing:.1em;color:#8B8C96;margin-bottom:5px;display:block}.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 16px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}.btn.p{background:#B4FF39;color:#0A0A0B}.btn.p:hover{background:#a5ef2b}.btn.g{background:transparent;border:1px solid #2A2A35;color:#8B8C96}.btn.g:hover{color:#F5F6FA}.btn.d{background:transparent;color:#FF3D71;padding:4px 8px;font-size:12px}.btn.l{background:transparent;color:#B4FF39;padding:4px 8px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:10px 12px;font-size:10px;font-family:monospace;text-transform:uppercase;letter-spacing:.1em;color:#8B8C96;border-bottom:1px solid #2A2A35}td{padding:10px 12px;border-bottom:1px solid rgba(42,42,53,.5)}.badge{font-size:10px;font-family:monospace;text-transform:uppercase;padding:2px 7px;border-radius:4px}.ba{background:rgba(180,255,57,.1);color:#B4FF39}.bp{background:rgba(255,178,61,.1);color:#FFB23D}.bs{background:rgba(255,61,113,.1);color:#FF3D71}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.sv{font-family:monospace;font-size:26px;font-weight:700;margin-top:4px}.tabs{display:flex;gap:4px;border-bottom:1px solid #2A2A35;margin-bottom:20px}.tab{padding:9px 14px;background:none;border:none;color:#8B8C96;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit;position:relative}.tab.a{color:#B4FF39}.tab.a::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#B4FF39}.modal{position:fixed;inset:0;background:rgba(10,10,11,.85);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:50}.mbox{background:#13131A;border:1px solid #2A2A35;border-radius:10px;padding:24px;max-width:680px;width:100%;margin:auto}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.err{color:#FF3D71;font-size:13px;margin-top:8px}.num{font-family:monospace}.tr{text-align:right}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.lcard{max-width:400px;width:100%}</style></head>
<body><div id="app"></div><script>
const D=localStorage.getItem('voltra_api')||'http://localhost:4000';
let API=D,token=localStorage.getItem('voltra_token'),user=JSON.parse(localStorage.getItem('voltra_user')||'null'),tab='masters',editing=null,creating=false;
async function req(p,o={}){const h={'Content-Type':'application/json'};if(token&&o.auth!==false)h.Authorization='Bearer '+token;const r=await fetch(API+p,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'HTTP '+r.status);return d;}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m,k='ok'){const e=document.createElement('div');e.style='position:fixed;bottom:20px;right:20px;background:#13131A;border:1px solid '+(k==='ok'?'#B4FF39':'#FF3D71')+';color:'+(k==='ok'?'#B4FF39':'#FF3D71')+';padding:10px 16px;border-radius:8px;font-size:13px;z-index:100';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}
function setSession(t,u){token=t;user=u;localStorage.setItem('voltra_token',t);localStorage.setItem('voltra_user',JSON.stringify(u));}
function logout(){token=null;user=null;localStorage.removeItem('voltra_token');localStorage.removeItem('voltra_user');render();}
function renderLogin(){document.getElementById('app').innerHTML=`<div class="login"><div class="lcard card"><div class="logo">VOLTRA · ADMIN</div><p style="color:#8B8C96;font-size:13px;margin:8px 0 16px">API: <span class="mono">${esc(API)}</span> <a href="#" id="cu">change</a></p><div style="margin-bottom:10px"><div class="lbl">Email</div><input id="em" class="input" value="admin@voltrasolutions.com"/></div><div style="margin-bottom:10px"><div class="lbl">Password</div><input id="pw" type="password" class="input" value="admin1234"/></div><button id="lb" class="btn p" style="width:100%;padding:11px;margin-top:6px">Login</button><div id="le" class="err"></div></div></div>`;
document.getElementById('lb').onclick=async()=>{try{const d=await req('/api/auth/login',{method:'POST',auth:false,body:{email:document.getElementById('em').value,password:document.getElementById('pw').value}});if(d.user.role!=='ADMIN'){document.getElementById('le').textContent='Not admin';return;}setSession(d.token,d.user);render();}catch(e){document.getElementById('le').textContent=e.message;}};
document.getElementById('cu').onclick=e=>{e.preventDefault();const u=prompt('API URL:',API);if(u){API=u.replace(/\/$/,'');localStorage.setItem('voltra_api',API);renderLogin();}};}
function shell(c){document.getElementById('app').innerHTML=`<div class="wrap"><div class="hdr"><div><div class="logo">VOLTRA · ADMIN</div><div style="color:#8B8C96;font-size:12px;margin-top:4px">${esc(user?.email)} · ${esc(API)}</div></div><button class="btn g" id="lo">Logout</button></div><div id="sr"></div><div class="tabs"><button class="tab ${tab==='masters'?'a':''}" data-t="masters">Masters</button><button class="tab ${tab==='users'?'a':''}" data-t="users">Users</button><button class="tab ${tab==='trades'?'a':''}" data-t="trades">Trades</button></div><div id="tc">${c}</div></div>`;
document.getElementById('lo').onclick=logout;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();});loadStats();}
async function loadStats(){try{const s=await req('/api/admin/stats');document.getElementById('sr').innerHTML=`<div class="stats"><div class="card"><div class="lbl">Users</div><div class="sv">${s.users}</div></div><div class="card"><div class="lbl">Active Masters</div><div class="sv">${s.activeMasters}</div></div><div class="card"><div class="lbl">Active Copies</div><div class="sv">${s.activeCopies}</div></div><div class="card"><div class="lbl">Platform P&L (30%)</div><div class="sv" style="color:#B4FF39">$${(s.totalPnl*.3).toFixed(2)}</div></div></div>`;}catch{}}
async function renderMasters(){shell('<div style="color:#8B8C96">Loading…</div>');let ml=[];try{ml=await req('/api/admin/masters');}catch(e){document.getElementById('tc').innerHTML=`<div class="err">${esc(e.message)}</div>`;return;}
const rows=ml.map(m=>`<tr><td style="font-weight:600">${esc(m.name)}</td><td class="num" style="color:#8B8C96">${esc(m.mt5Login)}</td><td style="color:#8B8C96;font-size:12px">${esc(m.style||'')}</td><td class="num tr" style="color:#B4FF39">+${(m.roi12m||0).toFixed(1)}%</td><td class="num tr" style="color:#FF3D71">-${(m.drawdown||0).toFixed(1)}%</td><td class="num tr">${((m.feeSplit||0)*100).toFixed(0)}%</td><td><span class="badge ${m.status==='ACTIVE'?'ba':m.status==='PAUSED'?'bp':'bs'}">${m.status}</span></td><td class="tr"><button class="btn l" data-e="${m.id}">Edit</button><button class="btn d" data-del="${m.id}">Delete</button></td></tr>`).join('');
document.getElementById('tc').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:18px">Masters (${ml.length})</h2><button class="btn p" id="nm">+ New</button></div><div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Name</th><th>MT5 Login</th><th>Style</th><th class="tr">ROI</th><th class="tr">DD</th><th class="tr">Fee</th><th>Status</th><th class="tr">Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="8" style="padding:20px;text-align:center;color:#8B8C96">No masters. Click + New.</td></tr>'}</tbody></table></div>`;
document.getElementById('nm').onclick=()=>showModal(null,ml);
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>showModal(ml.find(m=>m.id===b.dataset.e),ml));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete?'))return;try{await req('/api/admin/masters/'+b.dataset.del,{method:'DELETE'});toast('Deleted');render();}catch(e){toast(e.message,'err');}});}
function showModal(m,ml){const isEdit=!!m;m=m||{name:'',country:'',style:'',bio:'',mt5Login:'',mt5Server:'',feeSplit:0.3,status:'ACTIVE',experience:5,roi12m:0,drawdown:0,winRate:0,sharpe:0,profitFactor:0,rating:0};
const el=document.createElement('div');el.className='modal';el.innerHTML=`<div class="mbox"><h2 style="margin:0 0 4px;font-size:18px">${isEdit?'Edit':'New'} Master</h2><p style="color:#8B8C96;margin:0 0 16px;font-size:13px">MT5 trader profile in marketplace.</p><div class="g2">${['name:Name','country:Country','style:Style','experience:Experience (years)','mt5Login:MT5 Login *','mt5Server:MT5 Server *'].map(f=>{const[k,l]=f.split(':');return`<label><div class="lbl">${l}</div><input class="input" id="f_${k}" value="${esc(m[k]||'')}"/></label>`}).join('')}<label><div class="lbl">Platform Fee (0-1)</div><input class="input" type="number" step="0.01" id="f_feeSplit" value="${m.feeSplit}"/></label><label><div class="lbl">Status</div><select class="select" id="f_status"><option value="ACTIVE" ${m.status==='ACTIVE'?'selected':''}>ACTIVE</option><option value="PAUSED" ${m.status==='PAUSED'?'selected':''}>PAUSED</option><option value="SUSPENDED" ${m.status==='SUSPENDED'?'selected':''}>SUSPENDED</option></select></label></div><div style="border-top:1px solid #2A2A35;margin:12px 0 10px;padding-top:10px"><div style="color:#8B8C96;font-size:12px;margin-bottom:8px">Stats</div><div class="g3">${['roi12m:ROI 12M %','drawdown:Max DD %','winRate:Win Rate %','sharpe:Sharpe','profitFactor:Profit Factor','rating:Rating (0-5)'].map(f=>{const[k,l]=f.split(':');return`<label><div class="lbl">${l}</div><input class="input" type="number" step="0.1" id="f_${k}" value="${m[k]||0}"/></label>`}).join('')}</div></div><label><div class="lbl">Bio</div><textarea class="input" id="f_bio" rows="3">${esc(m.bio||'')}</textarea></label><div class="err" id="merr"></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn g" id="mc" style="flex:1">Cancel</button><button class="btn p" id="ms" style="flex:1">${isEdit?'Save':'Create'}</button></div></div>`;
document.body.appendChild(el);
el.querySelector('#mc').onclick=()=>el.remove();
el.querySelector('#ms').onclick=async()=>{const g=k=>el.querySelector('#f_'+k)?.value||'';const n=k=>parseFloat(el.querySelector('#f_'+k)?.value)||0;const payload={name:g('name'),country:g('country'),style:g('style'),bio:g('bio'),mt5Login:g('mt5Login'),mt5Server:g('mt5Server'),feeSplit:n('feeSplit'),status:g('status'),experience:parseInt(g('experience'))||0,roi12m:n('roi12m'),drawdown:n('drawdown'),winRate:n('winRate'),sharpe:n('sharpe'),profitFactor:n('profitFactor'),rating:n('rating')};try{if(isEdit)await req('/api/admin/masters/'+m.id,{method:'PATCH',body:payload});else await req('/api/admin/masters',{method:'POST',body:payload});toast(isEdit?'Saved':'Created');el.remove();render();}catch(e){el.querySelector('#merr').textContent=e.message;}};}
async function renderUsers(){shell('<div style="color:#8B8C96">Loading…</div>');let ul=[];try{ul=await req('/api/admin/users');}catch(e){document.getElementById('tc').innerHTML=`<div class="err">${esc(e.message)}</div>`;return;}
const rows=ul.map(u=>`<tr><td>${esc(u.email)}</td><td style="color:#8B8C96">${esc(u.name)}</td><td><span class="badge ${u.role==='ADMIN'?'ba':'bs'}">${u.role}</span></td><td class="num tr">${u._count.mt5Accounts}</td><td class="num tr">${u._count.copyRelations}</td><td class="num" style="color:#8B8C96;font-size:12px">${new Date(u.createdAt).toLocaleString()}</td></tr>`).join('');
document.getElementById('tc').innerHTML=`<h2 style="margin:0 0 14px;font-size:18px">Users (${ul.length})</h2><div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th class="tr">Accounts</th><th class="tr">Copies</th><th>Joined</th></tr></thead><tbody>${rows||'<tr><td colspan="6" style="padding:20px;text-align:center;color:#8B8C96">No users.</td></tr>'}</tbody></table></div>`;}
async function renderTrades(){shell('<div style="color:#8B8C96">Loading…</div>');let tl=[];try{tl=await req('/api/trades?limit=100',{auth:false});}catch(e){document.getElementById('tc').innerHTML=`<div class="err">${esc(e.message)}</div>`;return;}
const rows=tl.map(t=>`<tr><td class="num">${esc(t.symbol)}</td><td><span class="badge ${t.side==='BUY'?'ba':'bs'}">${t.side}</span></td><td class="num tr">${t.lots}</td><td class="num tr">${t.openPrice}</td><td class="num tr">${t.closePrice||'-'}</td><td class="num tr" style="color:${t.pnl>=0?'#B4FF39':'#FF3D71'}">${t.pnl>=0?'+':''}$${(t.pnl||0).toFixed(2)}</td><td><span class="badge ${t.status==='OPEN'?'bp':'ba'}">${t.status}</span></td></tr>`).join('');
document.getElementById('tc').innerHTML=`<h2 style="margin:0 0 14px;font-size:18px">Trades (${tl.length})</h2><div class="card" style="padding:0;overflow-x:auto"><table><thead><tr><th>Symbol</th><th>Side</th><th class="tr">Lots</th><th class="tr">Open</th><th class="tr">Close</th><th class="tr">P&L</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="7" style="padding:20px;text-align:center;color:#8B8C96">No trades.</td></tr>'}</tbody></table></div>`;}
function render(){if(!token||!user)return renderLogin();if(tab==='masters')renderMasters();else if(tab==='users')renderUsers();else renderTrades();}
render();
</script></body></html>
