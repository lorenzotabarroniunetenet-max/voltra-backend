<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Voltra Admin</title>
<style>
  :root {
    --bg:#0A0A0B; --surface:#13131A; --surface2:#1B1B24; --border:#2A2A35;
    --fg:#F5F6FA; --muted:#8B8C96; --brand:#B4FF39; --danger:#FF3D71; --warn:#FFB23D;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif; font-size:14px; }
  .mono { font-family:'JetBrains Mono',Menlo,monospace; }
  a { color:var(--brand); text-decoration:none; }
  .container { max-width:1280px; margin:0 auto; padding:24px; }
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
  .logo { font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:0.18em; font-size:18px; color:var(--brand); }
  .badge { font-size:10px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.1em; padding:3px 8px; border-radius:4px; }
  .badge.active { background:rgba(180,255,57,0.1); color:var(--brand); }
  .badge.paused { background:rgba(255,178,61,0.1); color:var(--warn); }
  .badge.suspended { background:rgba(255,61,113,0.1); color:var(--danger); }
  .badge.admin { background:rgba(180,255,57,0.1); color:var(--brand); }
  .badge.user { background:var(--surface2); color:var(--muted); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
  .input, .select, .textarea {
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--fg);
    border-radius:8px; padding:10px 12px; font-size:14px; outline:none; font-family:inherit;
  }
  .input:focus, .select:focus, .textarea:focus { border-color:var(--brand); }
  .label { font-size:11px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:6px; display:block; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:8px; border:none; cursor:pointer; font-size:14px; font-weight:600;
    transition:all 0.15s; font-family:inherit;
  }
  .btn.primary { background:var(--brand); color:var(--bg); }
  .btn.primary:hover { background:#a5ef2b; box-shadow:0 0 24px rgba(180,255,57,0.3); }
  .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--muted); }
  .btn.ghost:hover { color:var(--fg); border-color:var(--muted); }
  .btn.danger { background:transparent; color:var(--danger); padding:4px 8px; font-size:12px; }
  .btn.link { background:transparent; color:var(--brand); padding:4px 8px; font-size:12px; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; padding:12px; font-size:10px; font-family:'JetBrains Mono',monospace; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); border-bottom:1px solid var(--border); }
  td { padding:12px; border-bottom:1px solid rgba(42,42,53,0.5); }
  tr:hover td { background:rgba(27,27,36,0.4); }
  .num { font-family:'JetBrains Mono',monospace; }
  .text-right { text-align:right; }
  .text-brand { color:var(--brand); }
  .text-danger { color:var(--danger); }
  .text-muted { color:var(--muted); }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  @media (max-width:768px) { .stats { grid-template-columns:repeat(2,1fr); } }
  .stat-value { font-family:'JetBrains Mono',monospace; font-size:28px; font-weight:700; margin-top:4px; }
  .tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:20px; }
  .tab { padding:10px 16px; background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; position:relative; }
  .tab.active { color:var(--brand); }
  .tab.active::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:2px; background:var(--brand); }
  .modal-bg { position:fixed; inset:0; background:rgba(10,10,11,0.85); backdrop-filter:blur(8px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:720px; width:100%; }
  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { max-width:420px; width:100%; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .toast { position:fixed; bottom:20px; right:20px; background:var(--surface); border:1px solid var(--border); padding:12px 16px; border-radius:8px; font-size:13px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,0.4); }
  .toast.ok { border-color:var(--brand); color:var(--brand); }
  .toast.err { border-color:var(--danger); color:var(--danger); }
  .h1 { font-size:24px; font-weight:700; margin:0 0 4px; }
  .h2 { font-size:18px; font-weight:600; margin:0 0 8px; }
  .small { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ===== Config =====
const API_URL_DEFAULT = 'http://localhost:4000'
let API_URL = localStorage.getItem('voltra_api_url') || API_URL_DEFAULT
let token = localStorage.getItem('voltra_token') || null
let user = JSON.parse(localStorage.getItem('voltra_user') || 'null')
let currentTab = 'masters'
let editingMaster = null
let creating = false

// ===== HTTP =====
async function req(path, opts={}) {
  const headers = { 'Content-Type':'application/json' }
  if (token && opts.auth !== false) headers.Authorization = `Bearer ${token}`
  const res = await fetch(API_URL + path, { method:opts.method||'GET', headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
  const data = await res.json().catch(()=>({}))
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
  return data
}

// ===== Toast =====
function toast(msg, kind='ok') {
  const el = document.createElement('div')
  el.className = 'toast ' + kind
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(()=>el.remove(), 3000)
}

// ===== State helpers =====
function saveSession(t, u) {
  token = t; user = u
  localStorage.setItem('voltra_token', t)
  localStorage.setItem('voltra_user', JSON.stringify(u))
}
function logout() {
  token = null; user = null
  localStorage.removeItem('voltra_token')
  localStorage.removeItem('voltra_user')
  render()
}

// ===== HTML escape =====
function esc(s) {
  if (s == null) return ''
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

// ===== Login screen =====
function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card card">
        <div class="logo">VOLTRA · ADMIN</div>
        <h1 class="h1" style="margin-top:16px">Admin Login</h1>
        <p class="small" style="margin-bottom:20px">Backend: <span class="mono" style="color:var(--brand)">${esc(API_URL)}</span> <a href="#" id="change-url" style="margin-left:8px">change</a></p>
        <div style="margin-bottom:12px"><div class="label">Email</div><input id="email" class="input" value="admin@voltrasolutions.com" /></div>
        <div style="margin-bottom:12px"><div class="label">Password</div><input id="password" type="password" class="input" value="changeme123" /></div>
        <button id="login-btn" class="btn primary" style="width:100%; padding:12px; margin-top:8px">Login</button>
        <div id="login-err" class="err"></div>
      </div>
    </div>
  `
  document.getElementById('login-btn').onclick = async () => {
    const email = document.getElementById('email').value.trim()
    const password = document.getElementById('password').value
    const errEl = document.getElementById('login-err')
    errEl.textContent = ''
    try {
      const data = await req('/api/auth/login', { method:'POST', auth:false, body:{ email, password } })
      if (data.user.role !== 'ADMIN') { errEl.textContent = 'Not an admin account'; return }
      saveSession(data.token, data.user)
      render()
    } catch (e) { errEl.textContent = e.message }
  }
  document.getElementById('change-url').onclick = (ev) => {
    ev.preventDefault()
    const url = prompt('Backend API URL:', API_URL)
    if (url) { API_URL = url.replace(/\/$/, ''); localStorage.setItem('voltra_api_url', API_URL); renderLogin() }
  }
}

// ===== Main shell =====
function renderShell(content) {
  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="header">
        <div>
          <div class="logo">VOLTRA · ADMIN</div>
          <div class="small" style="margin-top:4px">${esc(user?.email || '')} · API: <span class="mono">${esc(API_URL)}</span></div>
        </div>
        <button class="btn ghost" id="logout-btn">Logout</button>
      </div>
      <div id="stats-row"></div>
      <div class="tabs">
        <button class="tab ${currentTab==='masters'?'active':''}" data-tab="masters">Masters</button>
        <button class="tab ${currentTab==='users'?'active':''}" data-tab="users">Users</button>
        <button class="tab ${currentTab==='trades'?'active':''}" data-tab="trades">Trades</button>
      </div>
      <div id="tab-content">${content}</div>
    </div>
  `
  document.getElementById('logout-btn').onclick = logout
  document.querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { currentTab = b.dataset.tab; render() }
  })
}

// ===== Stats =====
async function renderStats() {
  try {
    const s = await req('/api/admin/stats')
    document.getElementById('stats-row').innerHTML = `
      <div class="stats">
        <div class="card"><div class="label">Users</div><div class="stat-value">${s.users}</div></div>
        <div class="card"><div class="label">Active Masters</div><div class="stat-value">${s.activeMasters}</div></div>
        <div class="card"><div class="label">Active Copies</div><div class="stat-value">${s.activeCopies}</div></div>
        <div class="card"><div class="label">Platform P&L (30%)</div><div class="stat-value text-brand">$${(s.totalPnl*0.30).toFixed(2)}</div></div>
      </div>
    `
  } catch (e) { /* silent */ }
}

// ===== Masters tab =====
async function renderMasters() {
  renderShell('<div class="text-muted">Loading…</div>')
  await renderStats()
  let masters = []
  try { masters = await req('/api/admin/masters') } catch(e) { document.getElementById('tab-content').innerHTML = `<div class="err">${esc(e.message)}</div>`; return }

  const rows = masters.map(m => `
    <tr>
      <td style="font-weight:600">${esc(m.name)}</td>
      <td class="num text-muted">${esc(m.mt5Login)}</td>
      <td class="text-muted" style="font-size:12px">${esc(m.style||'')}</td>
      <td class="num text-right text-brand">+${(m.roi12m||0).toFixed(1)}%</td>
      <td class="num text-right text-danger">-${(m.drawdown||0).toFixed(1)}%</td>
      <td class="num text-right">${((m.feeSplit||0)*100).toFixed(0)}%</td>
      <td><span class="badge ${m.status.toLowerCase()}">${m.status}</span></td>
      <td class="num text-right text-muted">${m._count?.copyRelations || 0}</td>
      <td class="text-right">
        <button class="btn link" data-edit="${m.id}">Edit</button>
        <button class="btn danger" data-del="${m.id}">Delete</button>
      </td>
    </tr>
  `).join('')

  document.getElementById('tab-content').innerHTML = `
    <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center">
      <h2 class="h2">Masters (${masters.length})</h2>
      <button class="btn primary" id="new-master">+ New Master</button>
    </div>
    <div class="card" style="padding:0; overflow-x:auto">
      <table>
        <thead><tr>
          <th>Name</th><th>MT5 Login</th><th>Style</th>
          <th class="text-right">ROI</th><th class="text-right">DD</th>
          <th class="text-right">Fee</th><th>Status</th>
          <th class="text-right">Copies</th><th class="text-right">Actions</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="9" class="text-muted" style="padding:24px; text-align:center">No masters yet. Click + New Master.</td></tr>'}</tbody>
      </table>
    </div>
  `
  document.getElementById('new-master').onclick = () => { creating = true; editingMaster = null; renderMasterModal() }
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
    editingMaster = masters.find(m => m.id === b.dataset.edit); creating = false; renderMasterModal()
  })
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Delete master?')) return
    try { await req('/api/admin/masters/' + b.dataset.del, { method:'DELETE' }); toast('Deleted'); render() }
    catch (e) { toast(e.message, 'err') }
  })
}

// ===== Master modal =====
function renderMasterModal() {
  const m = editingMaster || { name:'', country:'', style:'', bio:'', mt5Login:'', mt5Server:'', feeSplit:0.30, status:'ACTIVE', experience:5, roi12m:0, drawdown:0, winRate:0, sharpe:0, profitFactor:0, rating:0 }
  const modal = document.createElement('div')
  modal.className = 'modal-bg'
  modal.innerHTML = `
    <div class="modal">
      <h2 class="h2">${editingMaster ? 'Edit' : 'New'} Master</h2>
      <p class="small" style="margin-bottom:16px">MT5 trader profile in marketplace.</p>
      <div class="grid-2">
        <div><div class="label">Name *</div><input class="input" id="f-name" value="${esc(m.name)}" /></div>
        <div><div class="label">Country</div><input class="input" id="f-country" value="${esc(m.country)}" placeholder="UK, IT, etc" /></div>
        <div><div class="label">Style</div><input class="input" id="f-style" value="${esc(m.style)}" placeholder="Scalping EUR/USD" /></div>
        <div><div class="label">Experience (years)</div><input class="input" id="f-experience" type="number" value="${m.experience}" /></div>
        <div><div class="label">MT5 Login *</div><input class="input" id="f-mt5Login" value="${esc(m.mt5Login)}" /></div>
        <div><div class="label">MT5 Server *</div><input class="input" id="f-mt5Server" value="${esc(m.mt5Server)}" placeholder="Broker-Live-01" /></div>
        <div><div class="label">Platform Fee (0-1)</div><input class="input" id="f-feeSplit" type="number" step="0.01" value="${m.feeSplit}" /></div>
        <div><div class="label">Status</div>
          <select class="select" id="f-status">
            <option value="ACTIVE" ${m.status==='ACTIVE'?'selected':''}>ACTIVE</option>
            <option value="PAUSED" ${m.status==='PAUSED'?'selected':''}>PAUSED</option>
            <option value="SUSPENDED" ${m.status==='SUSPENDED'?'selected':''}>SUSPENDED</option>
          </select>
        </div>
      </div>
      <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border)">
        <div class="small" style="margin-bottom:8px">Stats (manual for now, will auto-update once MT5 bridge connected)</div>
        <div class="grid-3">
          <div><div class="label">ROI 12M %</div><input class="input" id="f-roi12m" type="number" step="0.1" value="${m.roi12m}" /></div>
          <div><div class="label">Max DD %</div><input class="input" id="f-drawdown" type="number" step="0.1" value="${m.drawdown}" /></div>
          <div><div class="label">Win Rate %</div><input class="input" id="f-winRate" type="number" step="0.1" value="${m.winRate}" /></div>
          <div><div class="label">Sharpe</div><input class="input" id="f-sharpe" type="number" step="0.01" value="${m.sharpe}" /></div>
          <div><div class="label">Profit Factor</div><input class="input" id="f-profitFactor" type="number" step="0.01" value="${m.profitFactor}" /></div>
          <div><div class="label">Rating (0-5)</div><input class="input" id="f-rating" type="number" step="0.1" value="${m.rating}" /></div>
        </div>
      </div>
      <div style="margin-top:12px"><div class="label">Bio</div><textarea class="textarea" id="f-bio" rows="3">${esc(m.bio||'')}</textarea></div>
      <div class="err" id="modal-err"></div>
      <div style="display:flex; gap:8px; margin-top:20px">
        <button class="btn ghost" id="modal-cancel" style="flex:1">Cancel</button>
        <button class="btn primary" id="modal-save" style="flex:1">${editingMaster?'Save':'Create'}</button>
      </div>
    </div>
  `
  document.body.appendChild(modal)
  modal.querySelector('#modal-cancel').onclick = () => modal.remove()
  modal.querySelector('#modal-save').onclick = async () => {
    const get = (k) => modal.querySelector('#f-' + k).value
    const num = (k) => parseFloat(modal.querySelector('#f-' + k).value) || 0
    const payload = {
      name: get('name'), country: get('country'), style: get('style'), bio: get('bio'),
      mt5Login: get('mt5Login'), mt5Server: get('mt5Server'),
      feeSplit: num('feeSplit'), status: get('status'),
      experience: parseInt(get('experience')) || 0,
      roi12m: num('roi12m'), drawdown: num('drawdown'), winRate: num('winRate'),
      sharpe: num('sharpe'), profitFactor: num('profitFactor'), rating: num('rating')
    }
    try {
      if (editingMaster) await req('/api/admin/masters/' + editingMaster.id, { method:'PATCH', body:payload })
      else await req('/api/admin/masters', { method:'POST', body:payload })
      toast(editingMaster ? 'Saved' : 'Created')
      modal.remove(); render()
    } catch (e) { modal.querySelector('#modal-err').textContent = e.message }
  }
}

// ===== Users tab =====
async function renderUsers() {
  renderShell('<div class="text-muted">Loading…</div>')
  await renderStats()
  let users = []
  try { users = await req('/api/admin/users') } catch(e) { document.getElementById('tab-content').innerHTML = `<div class="err">${esc(e.message)}</div>`; return }
  const rows = users.map(u => `
    <tr>
      <td>${esc(u.email)}</td>
      <td class="text-muted">${esc(u.name)}</td>
      <td><span class="badge ${u.role.toLowerCase()}">${u.role}</span></td>
      <td class="num text-right">${u._count.mt5Accounts}</td>
      <td class="num text-right">${u._count.copyRelations}</td>
      <td class="num text-muted" style="font-size:12px">${new Date(u.createdAt).toLocaleString()}</td>
    </tr>
  `).join('')
  document.getElementById('tab-content').innerHTML = `
    <h2 class="h2" style="margin-bottom:16px">Users (${users.length})</h2>
    <div class="card" style="padding:0; overflow-x:auto">
      <table>
        <thead><tr><th>Email</th><th>Name</th><th>Role</th><th class="text-right">Accounts</th><th class="text-right">Copies</th><th>Joined</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6" class="text-muted" style="padding:24px; text-align:center">No users yet.</td></tr>'}</tbody>
      </table>
    </div>
  `
}

// ===== Trades tab =====
async function renderTrades() {
  renderShell('<div class="text-muted">Loading…</div>')
  await renderStats()
  let trades = []
  try { trades = await req('/api/trades?limit=100', { auth:false }) } catch(e) { document.getElementById('tab-content').innerHTML = `<div class="err">${esc(e.message)}</div>`; return }
  const rows = trades.map(t => `
    <tr>
      <td class="num">${esc(t.symbol)}</td>
      <td><span class="badge ${t.side==='BUY'?'active':'suspended'}">${t.side}</span></td>
      <td class="num text-right">${t.lots}</td>
      <td class="num text-right">${t.openPrice}</td>
      <td class="num text-right">${t.closePrice || '-'}</td>
      <td class="num text-right ${t.pnl >= 0 ? 'text-brand' : 'text-danger'}">${t.pnl >= 0 ? '+' : ''}$${(t.pnl||0).toFixed(2)}</td>
      <td><span class="badge ${t.status==='OPEN'?'paused':'active'}">${t.status}</span></td>
      <td class="num text-muted" style="font-size:12px">${t.closedAt ? new Date(t.closedAt).toLocaleString() : '-'}</td>
    </tr>
  `).join('')
  document.getElementById('tab-content').innerHTML = `
    <h2 class="h2" style="margin-bottom:16px">Trades (${trades.length})</h2>
    <div class="card" style="padding:0; overflow-x:auto">
      <table>
        <thead><tr><th>Symbol</th><th>Side</th><th class="text-right">Lots</th><th class="text-right">Open</th><th class="text-right">Close</th><th class="text-right">P&L</th><th>Status</th><th>Closed At</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8" class="text-muted" style="padding:24px; text-align:center">No trades yet.</td></tr>'}</tbody>
      </table>
    </div>
  `
}

// ===== Router =====
function render() {
  if (!token || !user) { renderLogin(); return }
  if (currentTab === 'masters') renderMasters()
  else if (currentTab === 'users') renderUsers()
  else if (currentTab === 'trades') renderTrades()
}

render()
</script>
</body>
</html>
